<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contratos Band FM 88,7</title>
<style>
:root{--verde:#1f7a3a;--verde-esc:#165a2a;--vermelho:#c9342b;--tinta:#1d2420;--cinza:#5f6b64;--linha:#d6ddd8;--fundo:#f3f5f2;--branco:#fff}
*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI",Roboto,Arial,sans-serif;background:var(--fundo);color:var(--tinta);font-size:15px}
header.topo{background:var(--verde);color:#fff;padding:12px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
header.topo h1{font-size:18px;margin:0;font-weight:700;letter-spacing:.2px}
header.topo .sp{flex:1}
main{max-width:1000px;margin:0 auto;padding:20px}
button,.btn{font:inherit;border:0;border-radius:6px;padding:9px 16px;cursor:pointer;background:var(--verde);color:#fff;font-weight:600}
button:hover{background:var(--verde-esc)}
button.sec{background:#fff;color:var(--verde);border:1px solid var(--verde)}
button.sec:hover{background:#eaf3ec}
button.perigo{background:#fff;color:var(--vermelho);border:1px solid var(--vermelho)}
button.perigo:hover{background:#fbeceb}
header.topo button{background:#fff;color:var(--verde)}
input,select,textarea{font:inherit;width:100%;padding:8px 10px;border:1px solid var(--linha);border-radius:6px;background:#fff;color:var(--tinta)}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--verde);outline-offset:1px}
label{display:block;font-size:13px;color:var(--cinza);margin-bottom:3px}
fieldset{border:1px solid var(--linha);background:#fff;border-radius:8px;margin:0 0 16px;padding:14px 16px}
legend{font-weight:700;color:var(--verde);padding:0 6px}
.grid{display:grid;gap:10px 12px;grid-template-columns:repeat(12,1fr)}
.c2{grid-column:span 2}.c3{grid-column:span 3}.c4{grid-column:span 4}.c5{grid-column:span 5}.c6{grid-column:span 6}.c8{grid-column:span 8}.c12{grid-column:span 12}
@media(max-width:720px){.grid>*{grid-column:span 12!important}}
.checks{display:flex;gap:16px;flex-wrap:wrap;align-items:center}
.checks label{display:flex;align-items:center;gap:6px;margin:0;color:var(--tinta);font-size:14px}
.checks input{width:auto}
table.t{width:100%;border-collapse:collapse}
table.t th,table.t td{padding:4px 6px;text-align:left;font-size:13px;border-bottom:1px solid var(--linha)}
table.t th{color:var(--cinza);font-weight:600}
.lista-item{display:flex;align-items:center;gap:14px;background:#fff;border:1px solid var(--linha);border-radius:8px;padding:12px 16px;margin-bottom:8px;cursor:pointer}
.lista-item:hover{border-color:var(--verde)}
.lista-item .num{font-weight:700;color:var(--vermelho);min-width:54px}
.lista-item .nome{flex:1}
.lista-item .nome small{display:block;color:var(--cinza)}
.barra{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.barra input{flex:1;min-width:200px}
.acoes{position:sticky;bottom:0;background:var(--fundo);padding:12px 0;display:flex;gap:10px;flex-wrap:wrap;border-top:1px solid var(--linha)}
.login{max-width:360px;margin:60px auto;background:#fff;border:1px solid var(--linha);border-radius:10px;padding:24px}
.login h2{margin:0 0 4px}.login p{color:var(--cinza);margin:0 0 16px}
.login div{margin-bottom:12px}
#aviso{position:fixed;left:50%;transform:translateX(-50%);bottom:24px;background:var(--tinta);color:#fff;padding:10px 18px;border-radius:8px;display:none;z-index:50}
.vazio{text-align:center;color:var(--cinza);padding:40px 0}
.hidden{display:none!important}

/* ===== FOLHA IMPRESSA ===== */
#folha{display:none}
.f{width:194mm;margin:0 auto;font-family:Arial,Helvetica,sans-serif;font-size:9.5pt;color:#000;line-height:1.25}
.f table{width:100%;border-collapse:collapse}
.f .cab{border:1px solid #333;margin-bottom:6px}
.f .cab td{padding:5px 8px;vertical-align:middle}
.f .logo{width:62mm;border-right:1px solid #333;text-align:center}
.f .logo .n{font-size:30pt;font-weight:900;color:#1f7a3a;line-height:1;letter-spacing:-1px}
.f .logo .b{font-size:20pt;font-weight:900;color:#c9342b;line-height:1;font-style:italic}
.f .logo .s{font-size:7pt;font-weight:700;color:#1f7a3a}
.f .emp{text-align:center}
.f .emp .t{font-size:15pt;font-weight:700}
.f .emp .r{font-size:10pt}
.f .emp .m{font-size:7pt;margin-top:3px}
.f .contrato{color:#c9342b;font-weight:700;text-align:center;font-size:11pt;margin:4px 0}
.f .sec{border-top:1.5px solid #1f7a3a;padding-top:4px}
.f .campo{display:flex;gap:4px;margin:3px 0;align-items:flex-end}
.f .campo b{font-weight:400;white-space:nowrap}
.f .campo span{flex:1;border-bottom:1px solid #555;min-height:13px;padding-left:3px}
.f .titulo{color:#c9342b;font-weight:700;text-align:center;font-size:11pt;margin:6px 0 3px}
.f .grade td,.f .grade th{border:1px solid #333;padding:2px 5px;height:17px;font-size:9pt}
.f .grade th{font-weight:700;text-align:center}
.f .grade td.p{width:30%}
.f .grade td.tp{width:25%;text-align:center;white-space:nowrap}
.f .cx{display:inline-block;width:3.2mm;height:3.2mm;border:1px solid #000;vertical-align:-1px;text-align:center;line-height:3mm;font-size:8pt;font-weight:700;margin:0 1px}
.f .meses th,.f .meses td{border:1px solid #333;padding:1px 4px;height:17.5px;font-size:9pt}
.f .meses th{font-weight:700;text-align:center}
.f .rodape{text-align:center;font-size:8.5pt;margin-top:4px}
.f .assin{display:flex;gap:16px;margin-top:22px}
.f .assin div{flex:1;border-top:1px solid #000;text-align:center;font-size:8pt;padding-top:2px}
.f .via{font-size:7.5pt;text-align:center;margin-top:6px}

@media print{
  @page{size:A4;margin:8mm}
  body{background:#fff}
  .app,header.topo,#aviso{display:none!important}
  #folha{display:block}
}
</style>
</head>
<body>

<div class="app">
  <header class="topo" id="topo">
    <h1>Contratos · Band FM 88,7</h1>
    <span class="sp"></span>
    <span id="usuario"></span>
    <button id="btnSair" class="hidden">Sair</button>
  </header>

  <!-- LOGIN -->
  <section id="vLogin" class="login hidden">
    <h2>Entrar</h2>
    <p>Acesso restrito à equipe comercial.</p>
    <div><label for="lEmail">E-mail</label><input id="lEmail" type="email" autocomplete="username"></div>
    <div><label for="lSenha">Senha</label><input id="lSenha" type="password" autocomplete="current-password"></div>
    <button id="btnEntrar" style="width:100%">Entrar</button>
  </section>

  <!-- LISTA -->
  <main id="vLista" class="hidden">
    <div class="barra">
      <input id="busca" placeholder="Buscar por razão social, nome fantasia, CNPJ ou nº do contrato">
      <button id="btnNovo">Novo contrato</button>
    </div>
    <div id="itens"></div>
  </main>

  <!-- FORMULÁRIO -->
  <main id="vForm" class="hidden">
    <h2 id="tituloForm" style="margin-top:0"></h2>

    <fieldset><legend>Cliente</legend>
      <div class="grid">
        <div class="c6"><label for="razao_social">Razão social</label><input id="razao_social"></div>
        <div class="c6"><label for="nome_fantasia">Nome fantasia</label><input id="nome_fantasia"></div>
        <div class="c6"><label for="endereco">Endereço</label><input id="endereco"></div>
        <div class="c2"><label for="numero_end">Nº</label><input id="numero_end"></div>
        <div class="c4"><label for="bairro">Bairro</label><input id="bairro"></div>
        <div class="c5"><label for="cidade">Cidade</label><input id="cidade"></div>
        <div class="c3"><label for="cep">CEP</label><input id="cep"></div>
        <div class="c4"><label for="fone">Fone</label><input id="fone"></div>
        <div class="c4"><label for="cnpj">CNPJ</label><input id="cnpj"></div>
        <div class="c4"><label for="inscr">Inscrição</label><input id="inscr"></div>
        <div class="c4"><label for="aniversario">Data de aniversário</label><input id="aniversario" type="date"></div>
        <div class="c6"><label for="email">E-mail</label><input id="email" type="email"></div>
        <div class="c6"><label for="responsavel">Responsável</label><input id="responsavel"></div>
      </div>
    </fieldset>

    <fieldset><legend>Roteiro de programação</legend>
      <table class="t" id="tabRoteiro"></table>
      <div class="grid" style="margin-top:12px">
        <div class="c12"><label for="obs">Observações</label><input id="obs"></div>
        <div class="c3"><label for="insercoes_diarias">Inserções diárias</label><input id="insercoes_diarias"></div>
        <div class="c3"><label for="insercoes_mensais">Inserções mensais</label><input id="insercoes_mensais"></div>
        <div class="c3"><label for="inicio">Início</label><input id="inicio" type="date"></div>
        <div class="c3"><label for="termino">Término</label><input id="termino" type="date"></div>
      </div>
    </fieldset>

    <fieldset><legend>Instruções para faturamento</legend>
      <div class="grid">
        <div class="c3"><label for="valor_mensal">Valor mensal (R$)</label><input id="valor_mensal" inputmode="decimal" placeholder="0,00"></div>
        <div class="c3"><label for="valor_total">Valor total (R$)</label><input id="valor_total" inputmode="decimal" placeholder="0,00"></div>
        <div class="c6"><label>Forma de pagamento</label>
          <div class="checks" id="formas"></div></div>
        <div class="c12"><label>Data de pagamento (dia)</label>
          <div class="checks" id="dias"></div></div>
      </div>
      <div style="margin:14px 0 6px;display:flex;gap:10px;align-items:center;flex-wrap:wrap">
        <button type="button" class="sec" id="btnParcelas">Preencher parcelas pelo período</button>
        <small style="color:var(--cinza)">Usa início, término, valor mensal e dia de pagamento.</small>
      </div>
      <div style="overflow-x:auto"><table class="t" id="tabParcelas"></table></div>
      <p style="font-size:12px;color:var(--cinza)">Quando for cheque de terceiro, especificar os dados no verso do contrato.</p>
    </fieldset>

    <fieldset><legend>Assinatura</legend>
      <div class="grid">
        <div class="c4"><label for="data_assinatura">Data</label><input id="data_assinatura" type="date"></div>
        <div class="c4"><label for="atendente">Atendimento comercial</label><input id="atendente"></div>
      </div>
    </fieldset>

    <div class="acoes">
      <button id="btnSalvar">Salvar</button>
      <button id="btnImprimir" class="sec">Imprimir</button>
      <button id="btnVoltar" class="sec">Voltar à lista</button>
      <span style="flex:1"></span>
      <button id="btnExcluir" class="perigo hidden">Excluir</button>
    </div>
  </main>
</div>

<div id="aviso" role="status"></div>
<div id="folha"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.js"></script>
<script>
/* ===== CONFIGURAÇÃO ===== */
const SUPABASE_URL = "https://wxfivvpufhiiuxhrnnbb.supabase.co";
const SUPABASE_KEY = "sb_publishable_BVdTwbwwgXLEAvIiFdWciA_U7wQ-jH7";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const PRODUTOS = [
  ["testemunhal","Testemunhal",["15","30"]],
  ["rotativo","Rotativo",["45","60"]],
  ["flash","Flash",null],
  ["pedagio","Pedágio",null],
  ["projeto","Projeto",null],
  ["chega_junto","Chega Junto",null]
];
const FORMAS = ["Vista","Banco","Carteira","Pix"];
const DIAS = ["05","10","15","20","25"];
const MESES = ["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
const CAMPOS = ["razao_social","nome_fantasia","endereco","numero_end","bairro","cidade","cep","fone","cnpj","inscr","email","responsavel","obs","insercoes_diarias","insercoes_mensais","valor_mensal","valor_total","atendente"];
const DATAS = ["aniversario","inicio","termino","data_assinatura"];

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let atual = null;       // id do contrato aberto
let numeroAtual = null; // nº do contrato aberto

function aviso(msg){ const a=$("aviso"); a.textContent=msg; a.style.display="block"; clearTimeout(aviso.t); aviso.t=setTimeout(()=>a.style.display="none",3200); }
function mostrar(v){ ["vLogin","vLista","vForm"].forEach(x=>$(x).classList.toggle("hidden",x!==v)); window.scrollTo(0,0); }
const fmtData = d => d ? d.split("-").reverse().join("/") : "";

/* ===== MONTAGEM DO FORMULÁRIO ===== */
function montarForm(){
  $("tabRoteiro").innerHTML = `<tr><th>Produto</th><th>Horários</th><th>Horários</th><th>Tempo</th></tr>` +
    PRODUTOS.map(([k,nome,tempos])=>`<tr>
      <td>${nome}</td>
      <td><input id="r_${k}_h1" aria-label="${nome} horários 1"></td>
      <td><input id="r_${k}_h2" aria-label="${nome} horários 2"></td>
      <td>${tempos ? `<div class="checks">${tempos.map(t=>`<label><input type="radio" name="r_${k}_t" value="${t}">${t}"</label>`).join("")}<label><input type="radio" name="r_${k}_t" value="">—</label></div>` : ""}</td>
    </tr>`).join("");
  $("formas").innerHTML = FORMAS.map(f=>`<label><input type="checkbox" name="forma" value="${f}">${f}</label>`).join("");
  $("dias").innerHTML = DIAS.map(d=>`<label><input type="radio" name="dia_pag" value="${d}">${d}</label>`).join("");
  $("tabParcelas").innerHTML = `<tr><th>Mês</th><th>Ano</th><th>Dia</th><th>Valor</th><th>Boleto</th></tr>` +
    MESES.map((m,i)=>`<tr><td>${m}</td>
      <td><input id="p${i}_ano" style="width:80px" inputmode="numeric" maxlength="4"></td>
      <td><input id="p${i}_dia" style="width:60px" inputmode="numeric" maxlength="2"></td>
      <td><input id="p${i}_valor" style="width:120px" inputmode="decimal"></td>
      <td><input id="p${i}_boleto" style="width:120px"></td></tr>`).join("");
}

function preencher(c){
  c = c || {};
  CAMPOS.forEach(k => $(k).value = c[k] ?? "");
  DATAS.forEach(k => $(k).value = c[k] ?? "");
  const r = c.roteiro || {};
  PRODUTOS.forEach(([k,,tempos])=>{
    const x = r[k] || {};
    $(`r_${k}_h1`).value = x.h1 ?? ""; $(`r_${k}_h2`).value = x.h2 ?? "";
    if(tempos) document.querySelectorAll(`input[name="r_${k}_t"]`).forEach(i=>i.checked = i.value === (x.tempo ?? ""));
  });
  document.querySelectorAll('input[name="forma"]').forEach(i=>i.checked=(c.formas_pagamento||[]).includes(i.value));
  document.querySelectorAll('input[name="dia_pag"]').forEach(i=>i.checked=i.value===c.dia_pagamento);
  const p = c.parcelas || [];
  MESES.forEach((_,i)=>{ const x=p[i]||{}; $(`p${i}_ano`).value=x.ano??""; $(`p${i}_dia`).value=x.dia??""; $(`p${i}_valor`).value=x.valor??""; $(`p${i}_boleto`).value=x.boleto??""; });
}

function coletar(){
  const c = {};
  CAMPOS.forEach(k => c[k] = $(k).value.trim());
  DATAS.forEach(k => c[k] = $(k).value || null);
  c.roteiro = {};
  PRODUTOS.forEach(([k,,tempos])=>{
    const t = tempos ? (document.querySelector(`input[name="r_${k}_t"]:checked`)?.value || "") : "";
    c.roteiro[k] = {h1:$(`r_${k}_h1`).value.trim(), h2:$(`r_${k}_h2`).value.trim(), tempo:t};
  });
  c.formas_pagamento = [...document.querySelectorAll('input[name="forma"]:checked')].map(i=>i.value);
  c.dia_pagamento = document.querySelector('input[name="dia_pag"]:checked')?.value || "";
  c.parcelas = MESES.map((_,i)=>({ano:$(`p${i}_ano`).value.trim(),dia:$(`p${i}_dia`).value.trim(),valor:$(`p${i}_valor`).value.trim(),boleto:$(`p${i}_boleto`).value.trim()}));
  return c;
}

/* ===== PARCELAS AUTOMÁTICAS ===== */
const paraNum = s => parseFloat(String(s||"").replace(/\./g,"").replace(",","."))||0;
const paraBR = n => n.toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2});
function gerarParcelas(){
  const ini=$("inicio").value, fim=$("termino").value;
  if(!ini||!fim) return aviso("Informe início e término.");
  const [ya,ma]=ini.split("-").map(Number), [yb,mb]=fim.split("-").map(Number);
  const dia = document.querySelector('input[name="dia_pag"]:checked')?.value || "";
  const val = $("valor_mensal").value.trim();
  MESES.forEach((_,i)=>{["ano","dia","valor"].forEach(f=>$(`p${i}_${f}`).value="");});
  let y=ya,m=ma,n=0;
  while((y<yb||(y===yb&&m<=mb))&&n<12){
    const i=m-1; $(`p${i}_ano`).value=y; $(`p${i}_dia`).value=dia; $(`p${i}_valor`).value=val; n++; m++; if(m>12){m=1;y++;}
  }
  if(val) $("valor_total").value = paraBR(paraNum(val)*n);
  aviso(n>=12 && (y<yb||(y===yb&&m<=mb)) ? "Período maior que 12 meses: só os 12 primeiros foram preenchidos." : `${n} parcela(s) preenchida(s).`);
}

/* ===== BANCO DE DADOS ===== */
function paraBanco(c){ const o={...c}; DATAS.forEach(k=>{ if(!o[k]) o[k]=null; }); return o; }

async function listar(){
  const { data, error } = await sb.from("contratos")
    .select("id,numero,razao_social,nome_fantasia,cnpj,inicio,termino")
    .order("numero",{ascending:false});
  if(error) return aviso("Erro ao carregar: "+error.message);
  window._lista = data || [];
  desenharLista();
}
function desenharLista(){
  const q = $("busca").value.toLowerCase().trim();
  const itens = (window._lista||[]).filter(c => !q || [c.numero,c.razao_social,c.nome_fantasia,c.cnpj].join(" ").toLowerCase().includes(q));
  $("itens").innerHTML = itens.length ? itens.map(c=>`
    <div class="lista-item" tabindex="0" data-id="${c.id}">
      <span class="num">Nº ${c.numero}</span>
      <span class="nome">${esc(c.razao_social||"(sem razão social)")}<small>${esc(c.nome_fantasia||"")} ${c.inicio?`· ${fmtData(c.inicio)} a ${fmtData(c.termino)}`:""}</small></span>
    </div>`).join("") : `<div class="vazio">Nenhum contrato encontrado. Clique em “Novo contrato” para começar.</div>`;
}
async function abrir(id){
  const { data, error } = await sb.from("contratos").select("*").eq("id",id).single();
  if(error) return aviso("Erro ao abrir: "+error.message);
  atual = data.id; numeroAtual = data.numero;
  preencher(data);
  $("tituloForm").textContent = `Contrato Nº ${data.numero}`;
  $("btnExcluir").classList.remove("hidden");
  mostrar("vForm");
}
function novo(){
  atual = null; numeroAtual = null; preencher({});
  $("tituloForm").textContent = "Novo contrato";
  $("btnExcluir").classList.add("hidden");
  mostrar("vForm");
}
async function salvar(){
  const dados = paraBanco(coletar());
  if(!dados.razao_social) return aviso("Preencha a razão social.");
  dados.updated_at = new Date().toISOString();
  const q = atual ? sb.from("contratos").update(dados).eq("id",atual) : sb.from("contratos").insert(dados);
  const { data, error } = await q.select().single();
  if(error) { aviso("Erro ao salvar: "+error.message); return false; }
  atual = data.id; numeroAtual = data.numero;
  $("tituloForm").textContent = `Contrato Nº ${data.numero}`;
  $("btnExcluir").classList.remove("hidden");
  aviso("Contrato salvo."); return true;
}
async function excluir(){
  if(!atual || !confirm("Excluir este contrato? Essa ação não pode ser desfeita.")) return;
  const { error } = await sb.from("contratos").delete().eq("id",atual);
  if(error) return aviso("Erro ao excluir: "+error.message);
  aviso("Contrato excluído."); await irLista();
}
async function irLista(){ mostrar("vLista"); await listar(); }

/* ===== IMPRESSÃO ===== */
function cx(on){ return `<span class="cx">${on?"X":""}</span>`; }
function linha(rotulo, valor){ return `<div class="campo"><b>${rotulo}</b><span>${esc(valor)}</span></div>`; }
function dataExtenso(d){
  if(!d) return {dia:"",mes:"",ano:""};
  const [y,m,dd]=d.split("-"); return {dia:dd, mes:MESES[+m-1].toLowerCase(), ano:y};
}
function montarFolha(c){
  const r = c.roteiro||{}, p=c.parcelas||[];
  const prod = PRODUTOS.map(([k,nome,tempos],idx)=>{
    const x=r[k]||{};
    let tempo="";
    if(k==="testemunhal") tempo = `${cx(x.tempo==="15")} 15" &nbsp; ${cx(x.tempo==="30")} 30"`;
    if(k==="rotativo") tempo = `${cx(x.tempo==="45")} 45" &nbsp; ${cx(x.tempo==="60")} 60"`;
    return `<tr><td class="p">${nome.toUpperCase()}:</td><td>${esc(x.h1)}</td><td>${esc(x.h2)}</td><td class="tp">${tempo}</td></tr>`;
  }).join("");

    <div style="display:flex;gap:10px"><div style="flex:2.5">${linha("CNPJ:",c.cnpj)}</div><div style="flex:2.7">${linha("Inscr.:",c.inscr)}</div></div>
    <div style="display:flex;gap:10px"><div style="flex:2.5">${linha("E-mail:",c.email)}</div><div style="flex:2.7">${linha("Responsável:",c.responsavel)}</div></div>
    ${linha("Data de Aniversário:",nasc)}

async function imprimir(){
  if(!(await salvar())) return;
  $("folha").innerHTML = montarFolha(coletar());
  setTimeout(()=>window.print(),100);
}

/* ===== AUTENTICAÇÃO E EVENTOS ===== */
async function iniciar(sessao){
  if(sessao){
    $("usuario").textContent = sessao.user.email; $("btnSair").classList.remove("hidden");
    await irLista();
  } else {
    $("usuario").textContent = ""; $("btnSair").classList.add("hidden"); mostrar("vLogin");
  }
}
$("btnEntrar").onclick = async ()=>{
  const { error } = await sb.auth.signInWithPassword({email:$("lEmail").value.trim(), password:$("lSenha").value});
  if(error) aviso("Não foi possível entrar: "+error.message);
};
$("lSenha").addEventListener("keydown",e=>{ if(e.key==="Enter") $("btnEntrar").click(); });
$("btnSair").onclick = ()=>sb.auth.signOut();
$("btnNovo").onclick = novo;
$("btnVoltar").onclick = irLista;
$("btnSalvar").onclick = salvar;
$("btnImprimir").onclick = imprimir;
$("btnExcluir").onclick = excluir;
$("btnParcelas").onclick = gerarParcelas;
$("busca").oninput = desenharLista;
$("itens").addEventListener("click",e=>{ const el=e.target.closest("[data-id]"); if(el) abrir(el.dataset.id); });
$("itens").addEventListener("keydown",e=>{ if(e.key==="Enter"){ const el=e.target.closest("[data-id]"); if(el) abrir(el.dataset.id); }});

montarForm();
sb.auth.onAuthStateChange((_ev,s)=>{ iniciar(s); });
</script>
